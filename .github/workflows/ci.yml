name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit --requirement requirements-dev.txt
      - name: Scan backend source
        working-directory: backend
        run: bandit --quiet --recursive app docker-entrypoint.py
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend lint, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  hosted-runtime:
    name: Hosted runtime tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  containers:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Exercise non-root startup and legacy volume migration
        run: |
          docker compose run --rm --no-deps --entrypoint python backend -c "from pathlib import Path; Path('/app/.cache/legacy-root-owned').write_text('legacy')"
          docker compose run --rm --no-deps backend python -c "import os; from pathlib import Path; assert os.geteuid() == 10001; assert Path('/app/.cache/legacy-root-owned').stat().st_uid == 10001; Path('/app/.cache/runtime-write').write_text('ok'); Path('/app/data/skyfield/runtime-write').write_text('ok')"
      - name: Remove smoke-test volumes
        if: always()
        run: docker compose down --volumes
